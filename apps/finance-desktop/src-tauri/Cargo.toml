[package]
name = "myfinance"
version = "1.0.6"
description = "Arqevon Finance - gestão financeira pessoal privada"
authors = ["Arqevon Code"]
edition = "2021"

[lib]
name = "myfinance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
