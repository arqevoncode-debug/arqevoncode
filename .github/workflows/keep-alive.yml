name: Manter o Supabase ativo

# O plano grátis do Supabase pausa o projeto após dias sem uso. Em 2026-10-05 ele foi encontrado
# pausado, com ativações e pedidos de licença fora do ar. Esta chamada diária faz uma consulta real
# ao banco e falha (avisando por e-mail do GitHub) se o banco não responder.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --retry 3 --retry-delay 20 https://myfinance-license-manager.vercel.app/api/health
