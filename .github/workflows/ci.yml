name: Validar monorepo

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  finance-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/finance-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/finance-desktop/package-lock.json
      - run: npm ci
      - run: npm test

  license-manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/license-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/license-manager/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  license-manager-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Mesma versão principal do Postgres do Supabase de produção (17 em 2026-10-05).
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/license-manager
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-migrations.sh
